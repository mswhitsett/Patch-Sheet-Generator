name: Build Mac App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Generate app icon
        run: |
          mkdir -p src-tauri/icons/icon.iconset
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path

          sizes = [16, 32, 64, 128, 256, 512, 1024]

          for size in sizes:
              img = Image.new('RGBA', (size, size), (0, 0, 0, 255))
              draw = ImageDraw.Draw(img)

              scale = size / 1024

              # Plug body
              draw.rounded_rectangle(
                  [
                      350 * scale,
                      350 * scale,
                      700 * scale,
                      520 * scale,
                  ],
                  radius=40 * scale,
                  fill='white'
              )

              # Plug shaft
              draw.rectangle(
                  [
                      700 * scale,
                      405 * scale,
                      860 * scale,
                      465 * scale,
                  ],
                  fill='white'
              )

              # Tip
              draw.polygon([
                  (860 * scale, 405 * scale),
                  (930 * scale, 435 * scale),
                  (860 * scale, 465 * scale)
              ], fill='white')

              # Strain relief / handle
              draw.rectangle(
                  [
                      280 * scale,
                      370 * scale,
                      350 * scale,
                      500 * scale,
                  ],
                  fill='white'
              )

              img.save(f'src-tauri/icons/icon.iconset/icon_{size}x{size}.png')
              if size <= 512:
                  img.save(f'src-tauri/icons/icon.iconset/icon_{size}x{size}@2x.png')

          Image.open('src-tauri/icons/icon.iconset/icon_1024x1024.png').save('src-tauri/icons/icon.png')
          PY

          iconutil -c icns src-tauri/icons/icon.iconset -o src-tauri/icons/icon.icns

      - name: Update Rust dependencies
        run: cargo update
        working-directory: src-tauri

      - name: Build Tauri App
        run: npm run tauri:build

      - name: Upload Mac Build
        uses: actions/upload-artifact@v4
        with:
          name: waymaker-patch-sheet-mac
          path: src-tauri/target/release/bundle/**
